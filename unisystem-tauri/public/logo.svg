<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Waveform 'U' -->
  <g stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Pulsing start dot -->
    <circle cx="24" cy="50" r="6" fill="#22c55e" stroke="none"/>
    
    <!-- Audio Wave forming 'U' -->
    <path d="M 46 50 
             L 60 50 
             L 75 10 
             L 90 70 
             C 90 100, 130 100, 130 70 
             L 145 10 
             L 160 50 
             L 175 50" />
  </g>

  <!-- Typographic Name -->
  <text x="180" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="76" fill="#f8fafc" letter-spacing="-1.5">
    niSystem
  </text>
</svg>
