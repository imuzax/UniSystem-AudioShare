<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <!-- iOS Core Blue Gradient -->
    <linearGradient id="iosBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- iOS Squircle App Icon Background -->
    <rect width="80" height="80" rx="18" fill="#000000" />
    
    <!-- Subtle premium inner shine -->
    <rect x="1" y="1" width="78" height="78" rx="17" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Apple-style AirDrop/Broadcast Symbol -->
    <circle cx="40" cy="56" r="6" fill="url(#iosBlue)" />
    <path d="M 26 42 A 20 20 0 0 1 54 42" fill="none" stroke="url(#iosBlue)" stroke-width="5" stroke-linecap="round" />
    <path d="M 15 31 A 36 36 0 0 1 65 31" fill="none" stroke="url(#iosBlue)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Ultra-Clean Apple Typography -->
  <text x="105" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="52" fill="#ffffff" letter-spacing="-1">
    <tspan font-weight="700">Uni</tspan><tspan font-weight="300" fill="#d4d4d8">System</tspan>
  </text>
</svg>
